services:
  # Python FastAPI Backend
  - type: web
    name: automl-analyst-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false

  # React Vite Frontend Static Site
  - type: web
    name: automl-analyst-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=optional && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_BACKEND_URL
        value: https://automl-analyst-backend-k0qn.onrender.com
